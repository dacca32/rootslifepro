name: rootslife-app
services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - rootslife-app

  api:
    build:
      context: ./server
      target: production
    restart: always
    env_file: ./server/.env
    volumes:
      - ./server:/app
      - /server/node_modules:/app/node_modules
    ports:
      - "5000:5000"
    networks:
      - rootslife-app
    depends_on:
      - postgres

  frontend:
    build:
      context: ./client
      target: production
      args:
        VITE_API_URL: http://${DOMAIN_NAME}
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - ./client/node_modules:/app/node_modules
    networks:
      - rootslife-app
    command: npm run build
    depends_on:
      - api

  caddy:
    image: caddy:2-apine
    build:
      context: ./caddy
      dockerfile: Dockerfile
    ports:
      - 80:80
      - 443:443
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rootslife-app
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  rootslife-app:
    driver: bridge
